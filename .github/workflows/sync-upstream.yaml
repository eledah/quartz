name: Sync with Upstream

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v5
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/jackyzha0/quartz.git || true

      - name: Fetch upstream
        run: |
          git fetch upstream v5

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/v5)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          if [ "$BEHIND" -gt 0 ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.has_updates == 'true'
        run: |
          set +e
          git merge upstream/v5 --no-edit --no-ff
          MERGE_EXIT=$?

          if [ "$MERGE_EXIT" -ne 0 ]; then
            echo "Merge had conflicts, attempting auto-resolution for known files..."

            # Upstream migrated plugins to npm — drop the legacy git lockfile.
            if git diff --name-only --diff-filter=U | grep -qx "quartz.lock.json"; then
              git rm -f quartz.lock.json 2>/dev/null || git add quartz.lock.json
              echo "Resolved quartz.lock.json (accepted upstream deletion)"
            fi

            # Dependency manifests are upstream-owned in this fork: we never
            # re-declare dependencies locally, so always take upstream's exact
            # pair. package.json and package-lock.json must stay in sync — never
            # run npm install while a manifest is still conflicted (npm aborts
            # with EJSONPARSE and the whole sync then fails for nothing).
            for f in package.json package-lock.json; do
              if git diff --name-only --diff-filter=U | grep -qx "$f"; then
                git checkout upstream/v5 -- "$f"
                git add "$f"
                echo "Resolved $f (accepted upstream manifest)"
              fi
            done

            REMAINING=$(git diff --name-only --diff-filter=U)
            if [ -n "$REMAINING" ]; then
              echo "merge_failed=true" >> $GITHUB_OUTPUT
              echo "conflict_files<<EOF" >> $GITHUB_OUTPUT
              echo "$REMAINING" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              git commit --no-edit
              echo "Auto-resolved all known conflicts and completed merge"
            fi
          fi
          set -e

      - name: Push changes (if merge succeeded)
        if: steps.check.outputs.has_updates == 'true' && steps.merge.outputs.merge_failed != 'true'
        run: |
          git push origin v5
          echo "Successfully synced with upstream"

      - name: Create issue for merge conflict
        if: steps.merge.outputs.merge_failed == 'true'
        uses: actions/github-script@v9
        env:
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        with:
          script: |
            const title = '🔄 Sync Failed: Merge Conflicts with Upstream';
            const conflictFiles = process.env.CONFLICT_FILES || '(unknown)';
            const body = `## Automatic sync failed

            The daily sync with upstream (jackyzha0/quartz) failed due to merge conflicts.

            ### Details
            - **Date:** ${new Date().toISOString()}
            - **Branch:** v5
            - **Upstream Branch:** jackyzha0/quartz:v5

            ### Files with conflicts
            \`\`\`
            ${conflictFiles}
            \`\`\`

            ### How to resolve
            1. Pull the latest changes locally:
               \`\`\`bash
               git fetch upstream
               git checkout v5
               git merge upstream/v5
               # Resolve conflicts manually (watch quartz.config.yaml, theme/, plugins/, custom.scss)
               git add .
               git commit -m "Merge upstream v5: resolved conflicts"
               git push origin v5
               \`\`\`
            2. Or manually sync via GitHub's "Sync fork" button and resolve conflicts there.

            ### Next Steps
            - [ ] Resolve merge conflicts
            - [ ] Push resolved changes
            - [ ] Close this issue once sync is complete

            ---
            *This issue was automatically created by the sync workflow.*`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'sync-conflict'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['sync-conflict', 'automated']
              });
              console.log('Created issue for merge conflict');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Sync still failing on ${new Date().toISOString()}.\n\nConflict files:\n\`\`\`\n${conflictFiles}\n\`\`\``
              });
              console.log('Commented on existing issue:', existingIssue.html_url);
            }

      - name: Fail workflow if merge failed
        if: steps.merge.outputs.merge_failed == 'true'
        run: |
          echo "Merge conflicts detected. Issue created."
          exit 1
